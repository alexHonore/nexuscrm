# ─────────────────────────────────────────────────────────────────────────────
# Groupe Nexus — Passerelle vocale : configuration rtpengine
#
# rtpengine fait le pont média entre :
#   - les fureteurs (WebRTC : ICE + DTLS-SRTP + rtcp-mux), et
#   - voip.ms (RTP/AVP en clair, RTCP séparé).
#
# IMPORTANT — interface média :
# L'option « interface » N'EST PAS définie ici : elle est passée en ligne de
# commande par docker-compose (--interface=${RTP_INTERFACE}, lue dans .env).
#   - VPS OVH / DigitalOcean : l'IP publique est directement sur la carte
#     réseau -> RTP_INTERFACE=203.0.113.7 (setup.sh la détecte tout seul).
#   - Nuage avec NAT 1:1 (AWS, GCP, Azure) : utiliser la forme
#     RTP_INTERFACE=IP_privée!IP_publique (ex. 10.0.0.5!203.0.113.7).
#     (Sur ces plateformes, l'entrée « cloud-init »/metadata donne les deux.)
#
# Le noyau du VPS n'a pas le module iptables de rtpengine : le relais se fait
# en espace utilisateur, largement suffisant pour un petit centre d'appels.
# ─────────────────────────────────────────────────────────────────────────────

[rtpengine]

# Journal sur la sortie d'erreur (récupéré par « docker logs »).
foreground = true
log-stderr = true
# Niveau 6 = très bavard (demandé pour le diagnostic initial). Une fois la
# passerelle validée, redescendre à 5 pour alléger les journaux.
log-level = 6

# Prise de contrôle « ng » — Kamailio s'y connecte en local seulement.
listen-ng = 127.0.0.1:22222

# Plage de ports RTP/RTCP (doit correspondre au pare-feu ouvert par setup.sh
# et à la documentation du README : UDP 23000-33000).
port-min = 23000
port-max = 33000

# Nettoyage des sessions :
timeout = 60            # média silencieux ET signalisation morte -> fermeture
silent-timeout = 3600   # média en silence (mise en garde) toléré 1 h
offer-timeout = 120     # offre jamais répondue -> libération après 2 min
delete-delay = 5        # délai avant destruction réelle après un « delete »
