#!KAMAILIO
# ═════════════════════════════════════════════════════════════════════════════
# Groupe Nexus — Passerelle vocale : configuration Kamailio
#
# Rôle : mandataire SIP « transparent » entre les téléphones web des
# téléphonistes (JsSIP dans le fureteur, SIP sur WebSocket sécurisé — WSS)
# et voip.ms (SIP classique sur UDP).
#
# DEUX MODES DE DÉPLOIEMENT (même fichier, sélection par variable d'env.) :
#
# 1) MODE TRAEFIK — PAR DÉFAUT (KVM Hostinger qui héberge déjà n8n) :
#    le Traefik existant termine le TLS sur :443 et relaie la poignée de
#    main WebSocket EN CLAIR vers le port WS_PORT (défaut 5066) de Kamailio
#    (réseau hôte), à travers le petit conteneur « ws-bridge » (socat).
#
#    Fureteur ── wss://voice.<dom>/ws :443 ──► Traefik ── ws :5066 ──► Kamailio ── UDP 5060 ──► voip.ms
#
#    Kamailio voit donc du « ws » alors que le client parle « wss » : c'est
#    le déchargement TLS (« TLS offload ») classique. Rien ne change pour la
#    logique SIP : la connexion WebSocket d'origine est retrouvée par
#    alias/htable (voir plus bas), et le point d'écoute ANNONCE l'adresse
#    publique (« advertise PUBLIC_IP:WS_PORT ») pour que Via/Record-Route
#    restent cohérents et reconnus comme « myself ». Aucun certificat n'est
#    requis ici : le module tls n'est même pas chargé.
#
# 2) MODE AUTONOME (annexe du README — VPS dédié, Caddy sur 80/443) :
#    définir WITH_STANDALONE_TLS (fait par docker-compose.standalone.yml)
#    pour activer EN PLUS l'écoute TLS/WSS directe sur 8443 avec les
#    certificats Let's Encrypt copiés par scripts/sync-certs.sh.
#
#   Fureteur (JsSIP)  ── WSS / DTLS-SRTP ──►  PASSERELLE  ── UDP 5060 / RTP ──►  voip.ms
#
# Modèle d'enregistrement : chaque fureteur s'enregistre À TRAVERS la
# passerelle directement auprès de voip.ms avec les identifiants de son
# sous-compte. La passerelle ne fait PAS office de registrar ni de B2BUA :
# elle relaie le REGISTER tel quel (l'authentification Digest se fait de
# bout en bout entre JsSIP et voip.ms).
#
# Problème à résoudre : voip.ms ne prend pas en charge l'en-tête Path
# (RFC 3327). On utilise donc la traversée « sans registrar » :
#   1. À l'enregistrement, on ajoute au Contact un paramètre
#      « ;alias=ip~port~transport » (set_contact_alias, module nathelper)
#      qui encode la connexion WebSocket d'origine.
#   2. voip.ms mémorise ce Contact et, avec NAT=yes sur le sous-compte,
#      envoie les INVITE entrants à l'adresse SOURCE du REGISTER, c.-à-d.
#      la passerelle (UDP 5060).
#   3. À la réception d'un INVITE de voip.ms, handle_ruri_alias() décode le
#      paramètre alias du R-URI et route le message vers la connexion
#      WebSocket encore ouverte.
#   4. Filet de sécurité : si le serveur voip.ms (Asterisk) a réécrit le
#      Contact et perdu le paramètre alias, on retrouve la connexion via une
#      table de hachage locale (htable « wsconn ») alimentée à chaque
#      REGISTER (clé = usager SIP du sous-compte ET usager du Contact).
#      Voir le README (« Plan B ») si ce mécanisme s'avérait insuffisant.
#
# Média : rtpengine fait le pont entre les deux mondes :
#   - côté fureteur : ICE obligatoire, DTLS-SRTP, rtcp-mux (WebRTC) ;
#   - côté voip.ms  : RTP/AVP en clair, pas d'ICE, RTCP séparé.
#
# Variables d'environnement (injectées par docker-compose) :
#   PUBLIC_IP           — IP publique du serveur (Via/Record-Route/SDP). Requise.
#   WS_PORT             — port WebSocket en clair (défaut 5066, mode Traefik).
#   WITH_STANDALONE_TLS — si définie (toute valeur) : active TLS/8443
#                         (mode autonome, certificats requis).
# ═════════════════════════════════════════════════════════════════════════════

#!defenv PUBLIC_IP
#!trydefenv WS_PORT
#!ifndef WS_PORT
#!define WS_PORT 5066
#!endif
#!trydefenv WITH_STANDALONE_TLS

# ── Drapeaux de transaction (mémorisés par tm, visibles en onreply_route) ────
# FLT_SRC_WS   : la requête vient d'un fureteur (WebSocket)
# FLT_SRC_PSTN : la requête vient de voip.ms (UDP)
#!define FLT_SRC_WS 10
#!define FLT_SRC_PSTN 11

# ── Gabarits de drapeaux rtpengine ───────────────────────────────────────────
# Les drapeaux décrivent comment TRAITER le SDP reçu pour l'autre côté.
#  Vers voip.ms  : profil RTP/AVP en clair, on retire ICE et DTLS,
#                  on sépare le RTCP (rtcp-mux-demux).
#  Vers fureteur : profil UDP/TLS/RTP/SAVPF (WebRTC), ICE forcé,
#                  DTLS passif (le fureteur initie la poignée de main),
#                  SDES désactivé, rtcp-mux offert. trust-address : on se
#                  fie à l'adresse du SDP de voip.ms (serveur public, pas
#                  de NAT) au lieu de l'adresse source du paquet.
#!define RTPFLAGS_TO_PSTN "RTP/AVP replace-origin replace-session-connection ICE=remove DTLS=off SDES-off rtcp-mux-demux"
#!define RTPFLAGS_TO_WS "UDP/TLS/RTP/SAVPF trust-address replace-origin replace-session-connection ICE=force DTLS=passive SDES-off rtcp-mux-offer"

####### Paramètres globaux ####################################################

debug=2                     # niveau de journalisation (2 = notices; monter à 3 pour déboguer)
log_stderror=yes            # l'image Docker lance kamailio avec -DD -E (journal sur stderr)

fork=yes
children=4                  # processus UDP (VPS 2 Go : 4 suffisent largement)
tcp_children=4              # processus TCP/TLS/WSS

auto_aliases=no
server_signature=no         # ne pas révéler « Kamailio » dans les réponses
sip_warning=0

# ── TCP / TLS / WebSocket ────────────────────────────────────────────────────
#!ifdef WITH_STANDALONE_TLS
enable_tls=yes              # mode autonome seulement (Traefik : TLS déchargé)
tls_max_connections=4096
#!endif
tcp_accept_no_cl=yes        # OBLIGATOIRE pour WebSocket (requêtes HTTP sans Content-Length)
tcp_connection_lifetime=3605 # durée de vie d'une connexion TCP/WS(S) inactive (s)
                             # > intervalle de réenregistrement JsSIP (600 s)
tcp_max_connections=4096
tcp_rd_buf_size=16384       # tampon de lecture (les SDP WebRTC sont volumineux)

# ── Points d'écoute ──────────────────────────────────────────────────────────
# UDP 5060    : côté voip.ms.
# TCP WS_PORT : WebSocket EN CLAIR (mode Traefik) — la poignée de main HTTP
#               arrive de Traefik (via le conteneur ws-bridge) et est promue
#               par event_route[xhttp:request] ci-dessous. Ce port ne doit PAS
#               être exposé à Internet : setup.sh ne l'ouvre dans le pare-feu
#               que pour les sous-réseaux Docker.
# TLS 8443    : WSS direct (mode autonome seulement).
# « advertise » force l'IP publique dans les en-têtes Via/Record-Route même si
# l'on écoute sur 0.0.0.0 — indispensable en mode Traefik : le client parle à
# voice.<domaine>:443, mais Kamailio doit annoncer une adresse qu'il
# reconnaîtra comme sienne (« myself ») quand les Route reviendront.
listen=udp:0.0.0.0:5060 advertise PUBLIC_IP:5060
listen=tcp:0.0.0.0:WS_PORT advertise PUBLIC_IP:WS_PORT
#!ifdef WITH_STANDALONE_TLS
listen=tls:0.0.0.0:8443 advertise PUBLIC_IP:8443
#!endif

####### Modules ###############################################################

loadmodule "tm.so"          # transactions SIP
loadmodule "sl.so"          # réponses sans état
loadmodule "rr.so"          # Record-Route / loose routing
loadmodule "pv.so"          # pseudo-variables
loadmodule "maxfwd.so"      # Max-Forwards
loadmodule "textops.so"     # has_body(), remove_hf()...
loadmodule "siputils.so"    # utilitaires SIP
loadmodule "xlog.so"        # journalisation depuis le script
loadmodule "sanity.so"      # validation des messages entrants
loadmodule "ctl.so"         # interface kamcmd (BINRPC)
loadmodule "corex.so"       # fonctions coeur additionnelles
#!ifdef WITH_STANDALONE_TLS
loadmodule "tls.so"         # TLS (certificats Let's Encrypt) — mode autonome
#!endif
loadmodule "xhttp.so"       # réception de la poignée de main HTTP WebSocket
loadmodule "websocket.so"   # transport SIP sur WebSocket (RFC 7118)
loadmodule "nathelper.so"   # set_contact_alias / handle_ruri_alias / nat_uac_test
loadmodule "rtpengine.so"   # pilotage du relais média rtpengine
loadmodule "htable.so"      # table usager -> connexion WebSocket (filet de sécurité)

# ── tm : temporisations ──────────────────────────────────────────────────────
modparam("tm", "failure_reply_mode", 3)
modparam("tm", "fr_timer", 30000)       # 30 s sans réponse provisoire -> échec
modparam("tm", "fr_inv_timer", 120000)  # 120 s de sonnerie maximum

# ── rr ───────────────────────────────────────────────────────────────────────
# enable_double_rr : deux en-têtes Record-Route quand la requête change de
# transport (WSS <-> UDP) — indispensable ici.
modparam("rr", "enable_double_rr", 1)
modparam("rr", "append_fromtag", 1)

# ── ctl : prise de commande pour kamcmd (rechargement TLS, diagnostics) ─────
modparam("ctl", "binrpc", "unix:/tmp/kamailio_ctl")

# ── tls : profils dans un fichier séparé (certificats Let's Encrypt) ────────
#!ifdef WITH_STANDALONE_TLS
modparam("tls", "config", "/etc/kamailio/tls.cfg")
#!endif

# ── websocket : maintien en vie des connexions ──────────────────────────────
# Un cadre Ping est envoyé après 60 s d'inactivité : garde ouvertes les
# associations NAT des fureteurs et détecte les connexions mortes.
modparam("websocket", "keepalive_mechanism", 1)   # 1 = Ping
modparam("websocket", "keepalive_timeout", 60)
modparam("websocket", "sub_protocols", 1)         # 1 = « sip » seulement

# ── nathelper ────────────────────────────────────────────────────────────────
# Pas de usrloc ici (pas de registrar) : le natping est désactivé, le
# maintien en vie côté fureteur est assuré par les Ping WebSocket.
modparam("nathelper", "natping_interval", 0)

# ── rtpengine : prise de contrôle ng (rtpengine écoute en local) ────────────
modparam("rtpengine", "rtpengine_sock", "udp:127.0.0.1:22222")

# ── htable : correspondance usager -> connexion WebSocket ────────────────────
# Expire après 2 h (les réenregistrements JsSIP la rafraîchissent bien avant).
modparam("htable", "htable", "wsconn=>size=8;autoexpire=7200;")

####### Routage des requêtes SIP ##############################################

request_route {
	route(REQINIT);

	# Sondes OPTIONS adressées à la passerelle elle-même : répondre 200.
	if (is_method("OPTIONS") && uri == myself && $rU == $null) {
		sl_send_reply("200", "OK");
		exit;
	}

	# Détection de la provenance + traitement NAT/WebSocket (alias du Contact).
	route(WSSRC);

	# CANCEL : relayer s'il correspond à une transaction INVITE en cours.
	if (is_method("CANCEL")) {
		if (t_check_trans()) {
			t_relay();
		}
		exit;
	}

	# Requêtes à l'intérieur d'un dialogue (ACK, BYE, re-INVITE...).
	route(WITHINDLG);

	# Absorber les retransmissions.
	if (t_precheck_trans()) {
		t_check_trans();
		exit;
	}
	t_check_trans();

	# À partir d'ici : uniquement des requêtes initiales (hors dialogue).
	# On retire tout Route préchargé (on décide nous-mêmes du chemin).
	remove_hf("Route");

	if (isflagset(FLT_SRC_WS)) {
		route(FROMWS);      # fureteur -> voip.ms
	} else {
		route(FROMPSTN);    # voip.ms -> fureteur
	}
}

# ── Vérifications initiales ──────────────────────────────────────────────────
route[REQINIT] {
	if (!mf_process_maxfwd_header("10")) {
		sl_send_reply("483", "Too Many Hops");
		exit;
	}
	if (!sanity_check("17895", "7")) {
		xlog("L_WARN", "passerelle: message malformé de $si:$sp\n");
		exit;
	}
	# Scanneurs SIP connus : abandon silencieux (pas de réponse = pas d'indice).
	if ($ua =~ "friendly.scanner|sipcli|sipvicious|VaxSIPUserAgent") {
		exit;
	}
	return;
}

# ── Provenance et traitement NAT/WebSocket ───────────────────────────────────
route[WSSRC] {
	# nat_uac_test("64") : vrai si le message est arrivé par WebSocket.
	if (nat_uac_test("64")) {
		setflag(FLT_SRC_WS);
		force_rport();

		if (is_method("REGISTER")) {
			# Ajoute « ;alias=ip~port~transport » au Contact : voip.ms
			# mémorisera ce Contact et nous le renverra dans le R-URI
			# des INVITE entrants -> handle_ruri_alias() saura décoder.
			set_contact_alias();
			# Filet de sécurité : mémoriser aussi la connexion localement.
			route(STOREWS);
		} else if (is_present_hf("Contact")) {
			if (!add_contact_alias()) {
				xlog("L_ERR", "passerelle: échec d'alias du Contact <$ct> de $si:$sp\n");
				sl_send_reply("400", "Bad Request");
				exit;
			}
		}
	} else {
		setflag(FLT_SRC_PSTN);
		force_rport();
	}
	return;
}

# ── Mémoriser la connexion WebSocket d'un enregistrement ─────────────────────
# Clés : usager From (nom du sous-compte voip.ms, ex. « 123456_alex ») ET
# usager du Contact (jeton aléatoire JsSIP) — selon la façon dont voip.ms
# construit le R-URI des INVITE entrants, l'une des deux clés correspondra.
route[STOREWS] {
	$var(wsdst) = "sip:" + $si + ":" + $sp + ";transport=" + $proto;
	if ($fU != $null && $fU != "") {
		$sht(wsconn=>$fU) = $var(wsdst);
	}
	$var(cu) = $(ct{tobody.uri}{uri.user});
	if ($var(cu) != $null && $var(cu) != "") {
		$sht(wsconn=>$var(cu)) = $var(wsdst);
	}
	return;
}

# ── Requêtes en dialogue ─────────────────────────────────────────────────────
route[WITHINDLG] {
	if (!has_totag()) return;

	if (loose_route()) {
		# Après consommation de nos Route, si aucune destination n'est
		# fixée, décoder l'alias du R-URI (cible = fureteur).
		route(WSDST);
		if (is_method("INVITE|UPDATE|ACK")) {
			# re-INVITE / offre-réponse en dialogue : repasser le SDP
			# par rtpengine (même logique directionnelle qu'à l'appel).
			route(MEDIAFWD);
		} else if (is_method("BYE")) {
			# Fin d'appel : libérer les ports RTP chez rtpengine.
			rtpengine_manage();
		}
		route(RELAY);
		exit;
	}

	if (is_method("ACK")) {
		if (t_check_trans()) {
			# ACK d'une réponse négative : suit la transaction.
			t_relay();
			exit;
		}
		exit;   # ACK orphelin : ignorer
	}
	sl_send_reply("404", "Not Found");
	exit;
}

# ── Résolution de la destination WebSocket ───────────────────────────────────
# 1. handle_ruri_alias() : décode « ;alias=ip~port~transport » du R-URI
#    (posé par set_contact_alias au REGISTER) et fixe $du en conséquence.
# 2. Sinon, recherche dans la htable « wsconn » par usager du R-URI
#    (cas où voip.ms a réécrit le Contact et perdu le paramètre alias).
route[WSDST] {
	# Une requête venue d'un fureteur vise voip.ms : rien à décoder.
	if (isflagset(FLT_SRC_WS)) return;
	if ($du != $null && $du != "") return;

	if (!handle_ruri_alias()) {
		xlog("L_ERR", "passerelle: alias R-URI invalide ($ru) de $si:$sp\n");
		sl_send_reply("400", "Bad Request");
		exit;
	}
	if ($du == $null || $du == "") {
		if ($rU != $null && $sht(wsconn=>$rU) != $null) {
			$du = $sht(wsconn=>$rU);
			xlog("L_INFO", "passerelle: destination WS via htable pour $rU -> $du\n");
		}
	}
	return;
}

# ── Média : passage du SDP des REQUÊTES par rtpengine ────────────────────────
# Les drapeaux décrivent le SDP reçu et le profil à produire pour l'autre côté.
route[MEDIAFWD] {
	if (!has_body("application/sdp")) return;
	if (isflagset(FLT_SRC_WS)) {
		# SDP WebRTC du fureteur -> profil RTP en clair pour voip.ms
		rtpengine_manage(RTPFLAGS_TO_PSTN);
	} else {
		# SDP RTP de voip.ms -> profil WebRTC pour le fureteur
		rtpengine_manage(RTPFLAGS_TO_WS);
	}
	return;
}

# ── Requêtes initiales venant d'un fureteur (WSS) ────────────────────────────
route[FROMWS] {
	# La passerelle n'est pas un relais SIP ouvert : seules les destinations
	# voip.ms sont permises (REGISTER, INVITE, MESSAGE...).
	if (!($rd =~ "voip.ms$")) {
		xlog("L_WARN", "passerelle: destination refusée $rd (de $si:$sp)\n");
		sl_send_reply("403", "Forbidden");
		exit;
	}

	if (is_method("INVITE")) {
		record_route();     # rester sur le chemin (ACK/BYE/re-INVITE)
		route(MEDIAFWD);    # SDP fureteur -> profil voip.ms
	}
	route(RELAY);
}

# ── Requêtes initiales venant de voip.ms (UDP) — appels entrants (DID) ──────
route[FROMPSTN] {
	# Retrouver la connexion WebSocket du destinataire (alias ou htable).
	route(WSDST);
	if ($du == $null || $du == "") {
		# Aucun fureteur connu pour ce R-URI : soit personne n'est branché,
		# soit un balayeur teste le port 5060.
		sl_send_reply("404", "Not Found");
		exit;
	}

	if (is_method("INVITE")) {
		record_route();
		route(MEDIAFWD);    # SDP voip.ms -> profil WebRTC
	}
	route(RELAY);
}

# ── Relais avec armement des routes de réponse/échec ─────────────────────────
route[RELAY] {
	if (is_method("INVITE|UPDATE|SUBSCRIBE|REFER")) {
		if (!t_is_set("onreply_route")) t_on_reply("REPLYMANAGE");
		if (!t_is_set("failure_route")) t_on_failure("FAILMANAGE");
	}
	if (!t_relay()) {
		sl_reply_error();
	}
	exit;
}

####### Routage des réponses ##################################################

onreply_route[REPLYMANAGE] {
	# Réponse émise par un fureteur (ex. 200 OK d'un appel entrant) : aliaser
	# son Contact pour que les requêtes en dialogue de voip.ms (BYE...)
	# retrouvent la connexion WebSocket via le R-URI.
	if (nat_uac_test("64") && is_present_hf("Contact")) {
		set_contact_alias();
	}

	if (has_body("application/sdp")) {
		if (isflagset(FLT_SRC_WS)) {
			# Transaction lancée par le fureteur -> cette réponse vient de
			# voip.ms : produire un SDP WebRTC pour le fureteur.
			rtpengine_manage(RTPFLAGS_TO_WS);
		} else if (isflagset(FLT_SRC_PSTN)) {
			# Transaction lancée par voip.ms -> cette réponse vient du
			# fureteur : produire un SDP RTP en clair pour voip.ms.
			rtpengine_manage(RTPFLAGS_TO_PSTN);
		}
	}
}

####### Routage des échecs ####################################################

failure_route[FAILMANAGE] {
	# Échec (ou annulation) d'un INVITE initial : libérer la session média
	# réservée chez rtpengine. (Pour un re-INVITE — has_totag — on ne touche
	# à rien : la session de l'appel établi doit survivre.)
	if (is_method("INVITE") && !has_totag()) {
		rtpengine_delete();
	}
	if (t_is_canceled()) exit;
}

####### Poignée de main WebSocket (HTTP -> WS) ################################

event_route[xhttp:request] {
	set_reply_close();
	set_reply_no_connect();

	# Seuls les ports WebSocket prévus sont acceptés :
	#   WS_PORT (ws en clair, derrière Traefik) et, en mode autonome, 8443.
#!ifdef WITH_STANDALONE_TLS
	if ($Rp != WS_PORT && $Rp != 8443) {
#!else
	if ($Rp != WS_PORT) {
#!endif
		xhttp_reply("403", "Forbidden", "", "");
		exit;
	}

	if ($hdr(Upgrade) =~ "websocket"
			&& $hdr(Connection) =~ "Upgrade"
			&& $rm =~ "GET") {
		if (ws_handle_handshake()) {
			# Connexion promue en WebSocket SIP : terminé.
			exit;
		}
	}
	xhttp_reply("404", "Not Found", "", "");
}

event_route[websocket:closed] {
	# Trace utile en dépannage : un fureteur vient de se déconnecter.
	# (Les entrées htable correspondantes expirent d'elles-mêmes.)
	xlog("L_INFO", "passerelle: connexion WebSocket $si:$sp fermée\n");
}
