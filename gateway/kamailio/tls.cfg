# ─────────────────────────────────────────────────────────────────────────────
# Groupe Nexus — Passerelle vocale : profils TLS de Kamailio
#
# ⚠ MODE AUTONOME SEULEMENT (docker-compose.standalone.yml, annexe du README).
# En mode Traefik (par défaut), le module tls n'est pas chargé et ce fichier
# est ignoré : c'est Traefik qui termine le TLS sur :443.
#
# Les certificats Let's Encrypt sont obtenus par Caddy puis recopiés vers
# ./certs (monté ici en /etc/kamailio/tls) par scripts/sync-certs.sh.
# Après un renouvellement, le script exécute « kamcmd tls.reload » pour
# recharger les certificats sans coupure.
#
# Les fureteurs se connectent en WSS sur le port 8443 : c'est ce profil
# serveur qui est présenté. Aucune connexion TLS sortante n'est établie
# (voip.ms est joint en UDP), le profil client reste donc minimal.
# ─────────────────────────────────────────────────────────────────────────────

[server:default]
method = TLSv1.2+
private_key = /etc/kamailio/tls/privkey.pem
certificate = /etc/kamailio/tls/fullchain.pem
# Les fureteurs ne présentent pas de certificat client :
verify_certificate = no
require_certificate = no

[client:default]
method = TLSv1.2+
verify_certificate = no
require_certificate = no
